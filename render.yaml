services:
  - type: web
    name: chewylab-api
    runtime: node
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: WEB_URL
        value: https://chewylab.blueberrieslab.com
      - key: COMMERCE_ENABLED
        value: "false"
      - key: LEGAL_PUBLICATION_CONFIRMED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHIPPING_AMOUNT_CENTS
        sync: false
